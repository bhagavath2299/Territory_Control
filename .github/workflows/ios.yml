name: iPhone app

on:
  push:
    branches: [ios-app]
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac to build on: macos-26 (Apple silicon), or macos-26-intel when GitHub has no Apple silicon Mac free"
        type: choice
        default: macos-26
        options: [macos-26, macos-26-intel]

permissions:
  contents: write  # to save the build to the ios-build branch

concurrency:
  group: iphone-app-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Build the app (iPhone and simulator)
        run: bash ci/build.sh

      - name: Play through it in the iPhone simulator
        timeout-minutes: 65
        run: bash ci/selftest.sh

      - name: Save the build to the ios-build branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish.sh

      - name: Attach the build to this run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: territory-control-iphone-${{ github.run_number }}
          path: |
            out/
            !out/.git
