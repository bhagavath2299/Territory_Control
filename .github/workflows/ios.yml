name: iPhone app

on:
  push:
    branches: [ios-app]
  workflow_dispatch:

permissions:
  contents: write  # to save the build to the ios-build branch

concurrency:
  group: iphone-app
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the app (iPhone and simulator)
        run: bash ci/build.sh

      - name: Play through it in the iPhone simulator
        timeout-minutes: 30
        run: bash ci/selftest.sh

      - name: Save the build to the ios-build branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/publish.sh

      - name: Attach the build to this run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: territory-control-iphone-${{ github.run_number }}
          path: |
            out/
            !out/.git
